name: Фото из телеграма на сайт

# Раз в 10 минут забирает у бота новые фотографии и публикует их на странице покоса.
# Своего сервера не нужно — всё делает раннер GitHub.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # коммит с новыми фото
  actions: write    # запустить пересборку сайта

concurrency:
  group: foto-bot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Поставить sharp для уменьшения снимков
        run: npm install --no-save --no-audit --no-fund sharp

      - name: Забрать фото у бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
        run: node scripts/foto-bot.mjs

      - name: Закоммитить, если что-то изменилось
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Изменений нет."
            exit 0
          fi
          git config user.name "foto-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Фото с телефона: обновить галерею на странице покоса"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # Пуш, сделанный встроенным токеном, не запускает другие workflow,
      # поэтому публикацию сайта дёргаем вручную.
      - name: Пересобрать сайт
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
