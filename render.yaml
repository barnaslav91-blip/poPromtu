databases:
  - name: popromtu-db
    plan: free
    databaseName: popromtu
    user: popromtu

services:
  - type: web
    name: popromtu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: popromtu-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
